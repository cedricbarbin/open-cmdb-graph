        type: string
        required: true
      - name: ipAddress
        type: string
      - name: os
        type: string
      - name: osVersion
        type: string
      - name: status
        type: string
        enum: [active, maintenance, decommissioned]
      - name: environment
        type: string
        enum: [prod, staging, dev]
      - name: cpuCores
        type: integer
      - name: ramGB
