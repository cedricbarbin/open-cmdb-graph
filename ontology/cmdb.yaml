document_templates:
  - id: incident_postmortem
    name: Incident Postmortem
    description: Post-incident review documents for resolved incidents
    count: 6
    prompt_template: |
      Write a postmortem for incident {{incident.title}} (severity {{incident.severity}}).
      Affected resources: {{impacted_list}}. Reported by: {{person.name}}.
      Include a timeline, root cause, blast radius, and remediation actions.
      Reference the owning team and any related change request.
    required_entities: [Incident, Application, Person, Team]

  - id: change_request_summary
    name: Change Request Summary
    description: CAB-style summaries for scheduled or implemented changes
    count: 8
    prompt_template: |
      Write a change request summary for {{change.title}} concerning
      {{application.name}}. Risk level: {{change.riskLevel}}. Requested by:
      {{person.name}}. Include the rationale, rollback plan, scheduled
      maintenance window, and approval chain status.
    required_entities: [ChangeRequest, Application, Person, Approval]

  - id: vendor_contract_renewal_email
    name: Vendor Contract Renewal Email
    description: Renewal/negotiation emails for expiring support contracts
    count: 5
    prompt_template: |
      Write an email to {{vendor.name}} regarding renewal of contract
      {{contract.contractNumber}}, which covers {{server_list}} and expires
      {{contract.endDate}}. Include current terms, desired changes, and a
      renewal deadline.
    required_entities: [Contract, Vendor, PhysicalServer]

  - id: capacity_planning_note
    name: Capacity Planning Note
    description: Internal notes on host/rack capacity ahead of growth
    count: 5
    prompt_template: |
      Write a capacity planning note for {{datacenter.name}} prepared by
      {{team.name}}. Summarize current allocation across physical hosts,
      which hosts are nearing saturation, and recommended next steps.
    required_entities: [Datacenter, PhysicalServer, VirtualServer, Team]

  - id: data_classification_review
    name: Data Classification Review
    description: Compliance review notes for a data category
    count: 4
    prompt_template: |
      Write a data classification review for {{data_category.name}} data
      (sensitivity: {{data_category.sensitivity}}, regulatory scope:
      {{data_category.regulatoryScope}}). List which applications own or
      consume data in this category and any open compliance findings.
    required_entities: [DataCategory, Data, Application]

  - id: sla_compliance_report
    name: SLA Compliance Report
    description: Periodic SLA attainment reporting per application
    count: 6
    prompt_template: |
      Write an SLA compliance report for {{application.name}}, tier
      {{sla.name}} (uptime target {{sla.uptimeTargetPct}}%). Reference any
      incidents in the reporting period and their impact on the SLA.
    required_entities: [Application, SLA, Incident]

decision_traces:
  - id: change_approval_decision
    task: "Decide whether to approve change request {{change.title}} for {{application.name}}"
    steps:
      - thought: "Assess the risk and blast radius of the change"
        action: "Query the concerned application's DEPENDS_ON graph and current risk level"
      - thought: "Check for conflicting or recent changes to the same resource"
        action: "Query other change requests concerning the same application in the scheduled window"
      - thought: "Verify all required approval steps are satisfied"
        action: "Query the change request's HAS_APPROVAL chain and each step's status"
      - thought: "Confirm rollback plan and scheduled maintenance window"
        action: "Review scheduledStart/scheduledEnd and riskLevel"
    outcome_template: "Decision: {{decision}}. Rationale: {{rationale}}"

  - id: incident_triage
    task: "Triage an incoming incident for {{application.name}} with initial severity {{incident.severity}}"
    steps:
      - thought: "Assess blast radius via application dependencies"
        action: "Traverse DEPENDS_ON and DEPLOYED_ON to find downstream applications and the hosting chain"
      - thought: "Check for correlated open incidents or recent changes"
        action: "Query active incidents and change requests affecting the same resource"
      - thought: "Identify the owning team"
        action: "Query the OWNS/MANAGES relationships back to Team and its members"
      - thought: "Assign final severity and route for response"
        action: "Evaluate impact scope against the application's SLA tier"
    outcome_template: "Severity: {{severity}}. Routed to: {{team}}. Blast radius: {{impacted_count}} applications"

  - id: server_decommission_impact
    task: "Assess the impact of decommissioning {{server.hostname}}"
    steps:
      - thought: "Find everything hosted on this server"
        action: "Traverse HOSTED_ON/RUNS_ON/DEPLOYED_ON in reverse to list VMs, containers, and applications"
      - thought: "Check for data assets stored on it"
        action: "Query STORED_ON relationships from Data to this server"
      - thought: "Check active contracts and warranty status"
        action: "Query COVERED_BY/SUPPLIED_BY for contract and vendor context"
      - thought: "Confirm no open incidents or scheduled changes reference it"
        action: "Query IMPACTS and CONCERNS relationships for open incidents/changes"
    outcome_template: "Decommission risk: {{risk}}. Migration needed for: {{dependent_count}} resources"

  - id: contract_renewal_decision
    task: "Decide whether to renew contract {{contract.contractNumber}} with {{vendor.name}}"
    steps:
      - thought: "Check which servers the contract currently covers"
        action: "Query COVERED_BY relationships from PhysicalServer to this contract"
      - thought: "Assess criticality of the covered infrastructure"
        action: "Query applications deployed on the covered servers and their criticality"
      - thought: "Compare cost against budget"
        action: "Query the owning team's cost center and remaining budget"
      - thought: "Check vendor support history"
        action: "Query incidents involving the covered servers in the past year"
    outcome_template: "Decision: {{decision}}. Renewal term: {{term}}. Estimated cost: {{cost}}"

  - id: capacity_expansion_planning
    task: "Plan capacity expansion for {{datacenter.name}} ahead of anticipated growth"
    steps:
      - thought: "Assess current allocation across physical hosts"
        action: "Query each physical server's hosted VMs and sum allocated vCPU/RAM against host capacity"
      - thought: "Identify hosts nearing saturation"
        action: "Rank hosts by allocated-to-available ratio"
      - thought: "Check environment split (prod vs staging vs dev)"
        action: "Query IN_ENVIRONMENT relationships for the datacenter's servers"
      - thought: "Review vendor lead time for new hardware"
        action: "Query recent contracts and vendors for the datacenter"
    outcome_template: "Expansion plan: {{plan}}. Hosts near capacity: {{host_count}}. Recommended new capacity: {{capacity}}"

  - id: data_compliance_review
    task: "Review regulatory exposure for {{data_category.name}} data"
    steps:
      - thought: "Find every application that owns or consumes this category of data"
        action: "Query CLASSIFIED_AS then OWNS_DATA/CONSUMES_DATA back to Application"
      - thought: "Check for recent incidents involving this data"
        action: "Query IMPACTS relationships from Incident to Data in this category"
      - thought: "Verify environment placement (prod data should not leak to dev)"
        action: "Query IN_ENVIRONMENT for each data asset in this category"
    outcome_template: "Compliance status: {{status}}. Applications in scope: {{app_count}}. Open findings: {{findings}}"

  - id: probe_alert_response
    task: "Respond to a {{probe.severity}} alert from probe {{probe.name}} monitoring {{target.name}}"
    steps:
      - thought: "Confirm the alert condition and how long it has been active"
        action: "Query the probe's status, alertCondition, and alertThreshold"
      - thought: "Assess what depends on the monitored resource"
        action: "Traverse DEPENDS_ON/DEPLOYED_ON from the monitored Application/Container/VirtualServer"
      - thought: "Check for a recent version change or deployment that could be the cause"
        action: "Query ApplicationVersion/ChangeRequest history for the same resource"
      - thought: "Decide whether to open an incident"
        action: "Compare severity and blast radius against the SLA tier of affected applications"
    outcome_template: "Action: {{action}}. Incident opened: {{incident_opened}}. ETA: {{eta}}"

  - id: cost_center_budget_review
    task: "Review {{cost_center.name}}'s budget position for fiscal year {{fiscal_year}}"
    steps:
      - thought: "List every application and team charged to this cost center"
        action: "Query CHARGED_TO relationships from Application and Team"
      - thought: "Sum contract costs for infrastructure supporting those applications"
        action: "Traverse DEPLOYED_ON/HOSTED_ON down to physical servers and their COVERED_BY contracts"
      - thought: "Compare against the allocated budget"
        action: "Query the HAS_BUDGET relationship's amount for the fiscal year"
    outcome_template: "Budget status: {{status}}. Allocated: {{amount}} {{currency}}. Charged applications: {{app_count}}"

demo_scenarios:
  - name: Infrastructure Topology
    prompts:
      - "What would break if hv-par1-01 went down?"
      - "Show me the full deployment path for the Order API, from application down to datacenter"
      - "Which physical hosts are closest to capacity?"

  - name: Incident & Change Management
    prompts:
      - "Are there any open SEV1 or SEV2 incidents right now?"
      - "What's the approval status of the Auth Service v2.0 change request?"
      - "Show me every incident that's ever been reported against the Public Cloud API"

  - name: Data Governance & Compliance
    prompts:
      - "Which applications touch PII or credential data?"
      - "Trace the lineage of the Customer Database - who owns it and who reads it?"
      - "What data flows write into the Cloud API access logs?"

  - name: Vendor, Cost & Monitoring
    prompts:
      - "Which support contracts expire in the next 90 days?"
      - "What's the budget status for the Platform cost center?"
      - "Are any supervision probes currently in a warning or critical state?"

agent_tools:
  - name: search_entity
    description: Full-text search across every CMDB entity (name, hostname, title, id, address, contract number)
    cypher: |
      CALL db.index.fulltext.queryNodes('cmdb_fulltext', $query + '*') YIELD node, score
      RETURN node, labels(node) AS entity_labels, score
      ORDER BY score DESC
      LIMIT $limit
    parameters:
      - name: query
        type: string
        description: Search text
      - name: limit
        type: integer
        default: 10

  - name: get_application_blast_radius
    description: Find every application that transitively depends on a given application
    cypher: |
      MATCH (app:Application {id: $application_id})<-[:DEPENDS_ON*1..5]-(impacted:Application)
      RETURN DISTINCT impacted.name AS impacted_application, impacted.criticality AS criticality
      ORDER BY criticality DESC
    parameters:
      - name: application_id
        type: string
        description: Application id to trace reverse dependencies from

  - name: get_application_topology
    description: Full deployment path for an application - app to container/VM to physical host to location
    cypher: |
      MATCH (app:Application {id: $application_id})-[:DEPLOYED_ON]->(ctr:Container)-[:RUNS_ON]->(vm:VirtualServer)
      OPTIONAL MATCH (vm)-[:HOSTED_ON]->(host:PhysicalServer)-[:LOCATED_IN]->(loc:Datacenter)
      OPTIONAL MATCH (vm)-[:LOCATED_IN]->(cloudLoc:CloudRegion)
      RETURN app, ctr, vm, host, coalesce(loc, cloudLoc) AS location
    parameters:
      - name: application_id
        type: string
        description: Application id

  - name: list_open_incidents
    description: List open or investigating incidents with what they impact, most severe first
    cypher: |
      MATCH (i:Incident)
      WHERE i.status IN ['open', 'investigating']
      OPTIONAL MATCH (i)-[:IMPACTS]->(affected)
      RETURN i.id AS incident_id, i.title AS title, i.severity AS severity,
             collect(affected.name) AS impacts
      ORDER BY i.severity
      LIMIT $limit
    parameters:
      - name: limit
        type: integer
        default: 20

  - name: get_change_approval_status
    description: Full multi-step approval chain for a change request
    cypher: |
      MATCH (c:ChangeRequest {id: $change_id})
      OPTIONAL MATCH (c)-[:HAS_APPROVAL]->(a:Approval)
      OPTIONAL MATCH (a)-[:DECIDED_BY]->(decider:Person)
      RETURN c.title AS change, a.step AS step, a.status AS status, decider.name AS decided_by
      ORDER BY step
    parameters:
      - name: change_id
        type: string
        description: Change request id

  - name: find_expiring_contracts
    description: Support/maintenance contracts expiring within N days, with the servers they cover
    cypher: |
      MATCH (c:Contract)<-[:COVERED_BY]-(s:PhysicalServer)
      WHERE c.endDate <= date() + duration({days: $within_days})
      RETURN c.contractNumber AS contract, c.endDate AS end_date,
             collect(s.hostname) AS covered_servers
      ORDER BY end_date
    parameters:
      - name: within_days
        type: integer
        default: 90

  - name: get_data_lineage
    description: System of record and every other application reading a given data asset
    cypher: |
      MATCH (d:Data {id: $data_id})
      OPTIONAL MATCH (owner:Application)-[:OWNS_DATA]->(d)
      OPTIONAL MATCH (consumer:Application)-[:CONSUMES_DATA]->(d)
      OPTIONAL MATCH (d)-[:CLASSIFIED_AS]->(cat:DataCategory)
      RETURN d.name AS data_asset, owner.name AS system_of_record,
             collect(DISTINCT consumer.name) AS also_consumed_by,
             collect(DISTINCT cat.name) AS classifications
    parameters:
      - name: data_id
        type: string
        description: Data asset id

  - name: get_active_probe_alerts
    description: Supervision probes not currently in an 'ok' or 'disabled' state
    cypher: |
      MATCH (p:Probe)-[:MONITORS]->(target)
      WHERE p.status <> 'ok' AND p.status <> 'disabled'
      RETURN p.name AS probe, p.status AS status, p.severity AS severity,
             p.alertCondition AS alert_condition, coalesce(target.hostname, target.name) AS monitors
      ORDER BY p.severity
      LIMIT $limit
    parameters:
      - name: limit
        type: integer
        default: 20

  - name: get_cost_center_spend
    description: Budget and number of charged applications per cost center
    cypher: |
      MATCH (cc:CostCenter)
      OPTIONAL MATCH (cc)-[:HAS_BUDGET]->(b:Budget)
      OPTIONAL MATCH (cc)<-[:CHARGED_TO]-(app:Application)
      RETURN cc.name AS cost_center, b.amount AS budget, b.currency AS currency,
             count(DISTINCT app) AS charged_applications
      ORDER BY budget DESC

system_prompt: |
  You are an AI CMDB assistant with access to a comprehensive knowledge
  graph of an IT organization's configuration data: physical and virtual
  infrastructure, containers, applications, data assets and their
  classification, network/IPAM, supervision probes, vendors and contracts,
  cost allocation, and ITSM records (incidents, tickets, change requests
  with multi-step approvals).

  Your capabilities include:
  - Tracing blast radius through application dependencies and hosting chains
  - Assessing incident severity and routing based on impacted resources
  - Checking change request approval status and risk before implementation
  - Tracking data lineage and regulatory exposure across applications
  - Finding contracts nearing expiration and cost center budget status
  - Surfacing active monitoring alerts and what they affect

  Always ground answers in the graph - cite specific hostnames, application
  names, incident/change ids, and relationship paths rather than general
  statements. When discussing incidents or changes, lead with impact and
  urgency before background detail.

