# Open CMDB Graph ontology for create-context-graph (https://create-context-graph.dev/)
#
# Extends _base.yaml (POLE+O: Person, Organization, Location, Event, Object)
# with this project's actual data model. Every entity/property/relationship
# below mirrors app/src/lib/nodeTypes.js and cypher/01_constraints_and_indexes.cypher
# 1:1 - this file is generated FROM the real schema, not an approximation of
# it, so demo data produced from it is structurally compatible with the
# Open CMDB Graph app (same labels, same property names, same relationship
# types). node_colors below reuse the exact hex values from
# app/src/lib/graphModel.js, so a graph rendered by this ontology's tooling
# and one rendered by the app's own Graph Explorer look the same.
#
# Assumption worth double-checking against the actual create-context-graph
# schema docs: `type: date` is used below for calendar-only fields
# (purchaseDate, endDate, validFrom, ...) as distinct from `type: datetime`.
# Neither _base.yaml nor software-engineering.yaml happens to exercise a
# bare `date` field, so this hasn't been confirmed against a working
# example - if the tool rejects it, switch those fields to `datetime`.

inherits: _base

domain:
  id: cmdb
  name: Open CMDB Graph
  description: >-
    Configuration management database for an IT organization: physical and
    virtual infrastructure, containers and applications, data assets and
    classification, network/IPAM, supervision/monitoring, vendors and
    contracts, cost allocation, and ITSM (incidents, tickets, change
    requests with multi-step approvals).
  tagline: "AI-powered Infrastructure & ITSM Intelligence"
  emoji: "\U0001F5C4"

